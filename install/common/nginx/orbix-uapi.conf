# cPanel UAPI and WHM API 1-compatible read-only routes backed by OrbixPanel access keys.
location ~ ^/execute/(Email/(list_mail_domains|list_pops|count_pops)|WebVhosts/list_domains)/?$ {
	expires                  off;
	include                  fastcgi_params;
	fastcgi_param            HTTP_AUTHORIZATION $http_authorization;
	fastcgi_param            SCRIPT_FILENAME /usr/local/hestia/web/execute/$1/index.php;
	fastcgi_pass             unix:/run/hestia-php.sock;
	fastcgi_intercept_errors off;
}

location ~ ^/json-api/(listaccts|accountsummary)/?$ {
	expires                  off;
	include                  fastcgi_params;
	fastcgi_param            HTTP_AUTHORIZATION $http_authorization;
	fastcgi_param            SCRIPT_FILENAME /usr/local/hestia/web/json-api/$1/index.php;
	fastcgi_pass             unix:/run/hestia-php.sock;
	fastcgi_intercept_errors off;
}