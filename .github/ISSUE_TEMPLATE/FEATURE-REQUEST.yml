name: Feature
description: Suggest a new idea or change
title: "[Feature] "
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        Is there a feature or change that would make OrbixPanel work better for hosting customers or server operators? Describe the real workflow and outcome you need.
        Before submitting a new idea, review the **[current feature requests](https://github.com/OrbixtarTechnologies/orbixtar-panel/labels/feature)** to see whether it has already been requested.
  - type: textarea
    id: request
    attributes:
      label: Describe the feature or change in detail
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Describe the current workflow and desired outcome
      description: Include the account role, routes or commands involved, expected permission boundary, and how success should be verified.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **Thank you** for taking the time to send us your request, we appreciate your contribution.
